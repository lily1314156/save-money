# ── Server ──────────────────────────────────
server.port=8080

# ── MySQL ────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/save_money?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── MyBatis ──────────────────────────────────
mybatis-plus.mapper-locations=classpath:com/example/demo/mapper/*.xml
mybatis-plus.configuration.map-underscore-to-camel-case=true

# Redis Settings
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# ── Thymeleaf ────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Google Maps ──────────────────────────────
# 後端 key
google.maps.api-server-key=${GOOGLE_MAPS_API_KEY:}
# 前端 key
google.maps.platform-key=${GOOGLE_MAPS_BROWSER_KEY:}