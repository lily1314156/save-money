<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVE MONEY - 重設密碼</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Noto+Sans+TC:wght@100..900&display=swap');
    </style>
    <link rel="stylesheet" href="/css/style-merged.css">
  </head>

  <body class="page-auth">
    <nav>
      <div class="logo">SAVE MONEY</div>
      <ul>
        <li><a href="/index">首頁</a></li>
        <li><a href="/stores">店家頁面</a></li>
        <li><a href="/profile">我的專區</a></li>
      </ul>
    </nav>

    <div class="container">
      <h1>重設密碼</h1>
      <p class="subtitle">請輸入新密碼以完成重設</p>
      <div id="alert" class="alert" style="display: none;"></div>
      <form id="change-password-form">
        <div class="form-group">
          <label for="newPassword">新密碼</label>
          <input type="password" id="newPassword" name="newPassword" placeholder="輸入新密碼" required />
        </div>
        <div class="form-group">
          <label for="confirmPassword">確認新密碼</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="再次輸入新密碼" required />
        </div>
        <button type="submit" class="button" id="submit-btn">送出</button>
      </form>
      <div class="footer">
        <a href="/login">返回登入</a>
      </div>
      <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const alertBox = document.getElementById('alert');

        if (!token) {
          alertBox.classList.add('alert-error');
          alertBox.textContent = '缺少重設密碼的 token，請重新從忘記密碼頁面操作';
          alertBox.style.display = 'block';
          document.getElementById('submit-btn').disabled = true;
        }

        document.getElementById('change-password-form').addEventListener('submit', function (e) {
          e.preventDefault();
          alertBox.style.display = 'none';
          alertBox.className = 'alert';

          const newPassword = document.getElementById('newPassword').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          if (newPassword !== confirmPassword) {
            alertBox.classList.add('alert-error');
            alertBox.textContent = '兩次輸入的密碼不一致';
            alertBox.style.display = 'block';
            return;
          }

          fetch('/api/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
          })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                alertBox.classList.add('alert-success');
                alertBox.textContent = '密碼已重設成功，請使用新密碼登入';
              } else {
                alertBox.classList.add('alert-error');
                alertBox.textContent = data.message || '重設失敗';
              }
              alertBox.style.display = 'block';
            })
            .catch(() => {
              alertBox.classList.add('alert-error');
              alertBox.textContent = '系統錯誤，請稍後再試';
              alertBox.style.display = 'block';
            });
        });
      </script>
    </div>
  </body>
</html>
