<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVE MONEY - 忘記密碼</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Noto+Sans+TC:wght@100..900&display=swap');
    </style>
    <link rel="stylesheet" href="/css/style-merged.css">
  </head>

  <body class="page-auth">
    <nav>
      <div class="logo">SAVE MONEY</div>
      <ul>
        <li><a href="/index">首頁</a></li>
        <li><a href="/stores">店家頁面</a></li>
        <li><a href="/profile">我的專區</a></li>
      </ul>
    </nav>

    <div class="container">
      <h1>忘記密碼</h1>
      <p class="subtitle">輸入註冊時的 Email，系統將產生重設密碼連結</p>
      <div id="alert" class="alert" style="display: none;"></div>
      <form id="forgot-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="輸入註冊 Email" required />
        </div>
        <button type="submit" class="button">送出</button>
      </form>
      <div class="footer">
        <a href="/login">返回登入</a>
      </div>
      <script>
        document.getElementById('forgot-form').addEventListener('submit', function (e) {
          e.preventDefault();
          const alertBox = document.getElementById('alert');
          alertBox.style.display = 'none';
          alertBox.className = 'alert';

          const email = document.getElementById('email').value;

          fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                const fullUrl = window.location.origin + data.resetUrl;
                alertBox.classList.add('alert-success');
                alertBox.innerHTML =
                  '請點擊以下連結重設密碼：' +
                  '<br><a class="reset-url" href="' + fullUrl + '">' + fullUrl + '</a>';
              } else {
                alertBox.classList.add('alert-error');
                alertBox.textContent = data.message || '重設失敗';
              }
              alertBox.style.display = 'block';
            })
            .catch(() => {
              alertBox.classList.add('alert-error');
              alertBox.textContent = '系統錯誤，請稍後再試';
              alertBox.style.display = 'block';
            });
        });
      </script>
    </div>
  </body>
</html>
